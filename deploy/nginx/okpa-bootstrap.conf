# Temporary HTTP-only bootstrap used solely to complete the first ACME challenge.
server {
    listen 80;
    server_name center.okpa.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/center.okpa.cn;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:7077;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name updates.okpa.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/updates.okpa.cn;
        default_type text/plain;
    }

    location /agent/ {
        alias /www/wwwroot/agent-update/;
        autoindex off;
    }
}

server {
    listen 80;
    server_name assets.okpa.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/assets.okpa.cn;
        default_type text/plain;
    }

    location /i/ {
        alias /www/wwwroot/img.mengyunet.cn/images/;
    }

    location / {
        proxy_pass http://127.0.0.1:23456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
