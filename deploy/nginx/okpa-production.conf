server {
    listen 80;
    server_name center.okpa.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/center.okpa.cn;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name center.okpa.cn;

    ssl_certificate /etc/letsencrypt/live/okpa-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okpa-platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OKPA:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / { return 302 /admin; }

    location / {
        proxy_pass http://127.0.0.1:7077;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    access_log /www/wwwlogs/center.okpa.cn.log;
    error_log /www/wwwlogs/center.okpa.cn.error.log;
}

server {
    listen 80;
    server_name updates.okpa.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/updates.okpa.cn;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name updates.okpa.cn;

    ssl_certificate /etc/letsencrypt/live/okpa-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okpa-platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OKPA:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / { return 302 /agent/ai-admin/latest.json; }

    location ~ ^/agent/(?:\.|.*(?:/\.|\.tmp$|\.bak$|\.sql(?:\.gz)?$)) {
        return 404;
    }

    location /agent/ {
        alias /www/wwwroot/agent-update/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        types {
            application/json json;
            application/zip zip;
            application/octet-stream exe blockmap;
            application/x-yaml yml yaml;
            text/plain txt sh;
        }
    }

    access_log /www/wwwlogs/updates.okpa.cn.log;
    error_log /www/wwwlogs/updates.okpa.cn.error.log;
}

server {
    listen 80;
    server_name assets.okpa.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/assets.okpa.cn;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name assets.okpa.cn;

    ssl_certificate /etc/letsencrypt/live/okpa-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okpa-platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OKPA:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;

    location /i/ {
        alias /www/wwwroot/img.mengyunet.cn/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:23456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter "https://img.mengyunet.cn" "https://assets.okpa.cn";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    access_log /www/wwwlogs/assets.okpa.cn.log;
    error_log /www/wwwlogs/assets.okpa.cn.error.log;
}
