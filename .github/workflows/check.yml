name: Check management source
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Isolated controller and delivery regressions
        run: sudo --preserve-env=PATH python3 -B -m unittest discover -s tools/upgrade-controller -p 'test_*.py' -v
      - name: Reproduce the controller archive from fixed Git objects
        run: |
          python3 tools/upgrade-controller/delivery.py build --repo . --revision "$(git rev-parse HEAD)" --version 0.1.0-rc.1 --output "$RUNNER_TEMP/controller-a.tar.gz"
          python3 tools/upgrade-controller/delivery.py build --repo . --revision "$(git rev-parse HEAD)" --version 0.1.0-rc.1 --output "$RUNNER_TEMP/controller-b.tar.gz"
          cmp "$RUNNER_TEMP/controller-a.tar.gz" "$RUNNER_TEMP/controller-b.tar.gz"
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:distribution
      - run: python3 -m unittest discover -s scripts -p test_sync_release_archives.py -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run architecture
      - run: npm test
      - run: npm run build
