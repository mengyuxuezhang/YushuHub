<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初始化管理后台 · YushuHub</title><style>
*{box-sizing:border-box}body{margin:0;padding:40px 20px;background:#f0f5f3;color:#193830;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:600px;margin:auto;padding:32px;background:white;border:1px solid #d3e2db;border-radius:12px}h1{font-size:28px;margin-top:0}label{display:block;font-weight:600;margin-top:20px}input{width:100%;padding:12px;border:1px solid #93ada1;border-radius:6px;font:inherit}button{margin-top:24px;background:#16634e;color:white;border:0;border-radius:6px;padding:12px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.6}small{display:block;color:#526b60}#status{white-space:pre-wrap}a{color:#16634e}</style></head><body><main><p>YUSHUHUB · 首次安装</p><h1>设置你的管理后台</h1><p>请先通过宝塔网站为此域名启用 HTTPS。完成初始化后，使用管理员登录，再粘贴授权方提供的接入信息。未取得有效授权时，经营功能不可用。</p><form id="install"><label for="token">安装口令</label><input id="token" type="password" required minlength="32" maxlength="128" autocomplete="off"><small>填写导入编排前设置的专用安装口令，请勿分享。</small><label for="publicUrl">后台最终域名</label><input id="publicUrl" type="url" required placeholder="https://admin.example.com" autocomplete="url"><small>填写启用 HTTPS 后的完整地址，不含子路径。应与授权接入信息的部署地址一致。</small><label for="password">管理员密码</label><input id="password" type="password" required minlength="16" maxlength="128" autocomplete="new-password"><small>16–128 位，包含字母与其他字符。管理员账号固定为 admin。</small><label for="confirm">再次输入密码</label><input id="confirm" type="password" required minlength="16" maxlength="128" autocomplete="new-password"><button type="submit">初始化后台</button></form><p id="status" role="status" aria-live="polite"></p><p><small>初始化失败会保留首次设置，使用相同域名与密码重试；不要删除数据库或数据卷。成功后此入口关闭，重启不会重设管理员。</small></p></main><script>
const form=document.querySelector('form'),status=document.querySelector('#status'),button=document.querySelector('button');
document.querySelector('#publicUrl').value=location.protocol==='https:'?location.origin:'';
form.addEventListener('submit',async event=>{event.preventDefault();if(document.querySelector('#password').value!==document.querySelector('#confirm').value){status.textContent='两次密码不一致';return}button.disabled=true;status.textContent='正在提交初始化设置…';try{const response=await fetch('/api/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.querySelector('#token').value,publicUrl:document.querySelector('#publicUrl').value,password:document.querySelector('#password').value})});const result=await response.json();if(!response.ok)throw Error(result.error||'暂时无法初始化');form.hidden=true;document.querySelectorAll('input[type="password"]').forEach(input=>input.value='');status.textContent='正在初始化数据库，通常需要一至三分钟。请保持页面打开。';for(let attempt=0;attempt<180;attempt++){await new Promise(resolve=>setTimeout(resolve,2000));try{const check=await fetch('/readyz',{cache:'no-store'});if(check.ok){status.textContent='初始化完成，正在打开登录页…';location.replace('/admin/v2/');return}}catch{}}status.textContent='后台仍未就绪。请在宝塔查看容器日志；若初始化页恢复，可使用首次域名和密码重试。';form.hidden=false}catch(error){status.textContent=error.message}finally{button.disabled=false}});
</script></body></html>
